version: 2

# Weekly, with minor and patch updates grouped per ecosystem: one pull request to review instead of
# one per dependency. Major updates and security fixes still get their own.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The RustCrypto crates share traits: they can only move to a new major version together.
      rustcrypto:
        patterns: [aes, cbc, ctr, cipher, md-5, sha1, sha2, digest]
      rust:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]

  # Base images are pinned to digests in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      images:
        update-types: [minor, patch]
    ignore:
      # Node only builds the web interface: it moves from one LTS release to the next by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
