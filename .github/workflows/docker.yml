name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Changes to the image are built (not published) before they are merged.
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main replace each other's `edge` image; release tags always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Nothing is published unless the checks pass on the same commit.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runtime stage installs Alpine packages for each target platform, which needs emulation
      # for arm64; the compile stages cross-compile natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `latest` comes with the semver tags of stable releases only (metadata-action's default):
      # pre-releases such as v1.1.0-rc.1 get their exact version and nothing else.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha
        env:
          # The multi-arch index is what registries show: annotate it too.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      # Start the amd64 image before anything is published: it must answer its health check as an
      # unprivileged user and carry its tools and license files.
      - name: Build the image to test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rustload:test
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name rustload -p 8800:8800 -e PUID=1000 -e PGID=1000 \
            -e RUSTLOAD_ADMIN_USER=admin -e RUSTLOAD_ADMIN_PASSWORD=smoke-test-password rustload:test
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8800/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8800/api/health
          docker exec rustload sh -euc '
            7zz i > /dev/null
            yt-dlp --version
            ffmpeg -hide_banner -version | head -n 1
            ls /usr/share/doc/rustload/LICENSE /usr/share/doc/rustload/THIRD-PARTY-LICENSES.md
            test "$(stat -c %u:%g /config)" = 1000:1000
            ! ps -o user,comm | grep rustload | grep -q root
          '
      - name: Container logs
        if: always()
        run: docker logs rustload || true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
