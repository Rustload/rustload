name: Release

on:
  push:
    tags: ["v*"]
  # Builds every release file without publishing anything, to try this workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published unless the checks pass on the same commit. The interface it builds
  # (`web-dist`) is the one embedded in every binary.
  ci:
    uses: ./.github/workflows/ci.yml

  binary:
    name: Binary (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any Linux distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Same cross-compiler as the Docker image.
      - if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.16.0 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          name="rustload-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=rustload
          [[ "${{ matrix.target }}" == *windows* ]] && exe=rustload.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip -bso0 "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The installer is also the update; `.sig` files are the updater's signatures.
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            bundles: "nsis/*.exe nsis/*.exe.sig"
          # One app for Apple silicon and Intel Macs; the updater replaces the .app from its archive.
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundles: "dmg/*.dmg macos/*.app.tar.gz macos/*.app.tar.gz.sig"
          # The oldest supported Ubuntu, so the AppImage runs on older distributions too. The .deb is
          # updated by its package manager, the AppImage by the app.
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            bundles: "appimage/*.AppImage appimage/*.AppImage.sig deb/*.deb"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
          key: ${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf
      - name: Build
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.12.3 build --ci ${{ matrix.args }}
      - name: Collect
        run: |
          mkdir dist
          target=desktop/target/release
          [ -n "${{ matrix.targets }}" ] && target=desktop/target/universal-apple-darwin/release
          for pattern in ${{ matrix.bundles }}; do cp $target/bundle/$pattern dist/; done
          # The macOS update archive is named after the app only: give it its version like the rest.
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -n 1)"
          for file in dist/Rustload.app.tar.gz*; do
            [ -e "$file" ] && mv "$file" "dist/Rustload_${version}_universal.app.tar.gz${file#dist/Rustload.app.tar.gz}"
          done
          ls -l dist
      # The same program without installer: its `data` folder turns on the portable mode.
      - name: Portable copy
        if: runner.os == 'Windows'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -n 1)"
          dir=portable/Rustload
          mkdir -p "$dir/data"
          exe=desktop/target/release/Rustload.exe
          [ -f "$exe" ] || exe=desktop/target/release/rustload-desktop.exe
          cp "$exe" "$dir/Rustload.exe"
          cp LICENSE desktop/THIRD-PARTY-LICENSES.md "$dir/"
          cat > "$dir/data/README.txt" <<'EOF'
          Rustload runs as a portable app because this folder is next to Rustload.exe: its settings,
          queue, history and window data stay here, nothing goes to your user profile. Downloads still
          go to your Downloads\Rustload folder (categories can send them elsewhere). Without this
          folder, Rustload keeps its data in your user profile like the installed app.
          EOF
          (cd portable && 7z a -tzip -bso0 "../dist/Rustload_${version}_x64-portable.zip" Rustload)
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  extension:
    name: Browser extension
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The zip holds manifest.json at its root, as the Chrome Web Store and addons.mozilla.org want.
      # Its name has no version, so releases/latest/download/rustload-extension.zip always works.
      - run: |
          mkdir dist
          cd extension && zip -q -r -X ../dist/rustload-extension.zip . -x README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension
          path: dist/*
          if-no-files-found: error

  # Firefox only installs add-ons signed by Mozilla. Signing as "unlisted" publishes nothing on
  # addons.mozilla.org: the signed file is attached to the release and updates itself through
  # firefox-updates.json. Skipped until the AMO_JWT_ISSUER/AMO_JWT_SECRET secrets exist (an API key
  # of a free addons.mozilla.org account), and only for releases: each version can be signed once.
  firefox:
    name: Firefox add-on
    needs: ci
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: env.AMO_JWT_ISSUER != ''
        run: |
          npx --yes web-ext@8.10.0 sign --channel unlisted --source-dir extension --artifacts-dir signed \
            --ignore-files README.md --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mkdir dist
          mv signed/*.xpi dist/rustload-firefox.xpi
      - if: env.AMO_JWT_ISSUER != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-firefox
          path: dist/*
          if-no-files-found: error

  # Every version number must be the tag's: the desktop app compares its own with the update's.
  versions:
    name: Versions
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for file in Cargo.toml desktop/Cargo.toml; do
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$file" | head -n 1)"
            [ "$version" = "$tag" ] || { echo "::error file=$file::version $version, tag $tag"; status=1; }
          done
          for file in web/package.json extension/manifest.json; do
            version="$(jq -r .version "$file")"
            [ "$version" = "$tag" ] || { echo "::error file=$file::version $version, tag $tag"; status=1; }
          done
          exit $status

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [versions, binary, desktop, extension, firefox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The manifest the desktop app checks for updates (releases/latest/download/latest.json).
      - run: python3 .github/scripts/update_manifest.py dist "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY"
      # What installed Firefox add-ons check for updates, when the release has a signed one.
      - run: |
          [ -f dist/rustload-firefox.xpi ] || exit 0
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/rustload-firefox.xpi"
          jq -n --arg version "$version" --arg url "$url" --arg id "$(jq -r .browser_specific_settings.gecko.id extension/manifest.json)" \
            '{addons: {($id): {updates: [{version: $version, update_link: $url}]}}}' > dist/firefox-updates.json
      - run: cd dist && sha256sum -- * > SHA256SUMS
      # Anyone can check a download came from this workflow: `gh attestation verify <file> -R rustload/rustload`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The changelog section of this version, without its heading.
          changes="$(awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found
          ' CHANGELOG.md)"
          if [ -z "$changes" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          {
            echo "## Install"
            echo
            echo "- **Docker** (\`linux/amd64\`, \`linux/arm64\`): \`ghcr.io/rustload/rustload:$version\` — see the [quick start](https://github.com/rustload/rustload#quick-start-docker)."
            echo "- **Binary**: download the archive for your system below, extract it and run \`rustload\` — see [running without Docker](https://github.com/rustload/rustload#without-docker)."
            echo "- **Desktop app**: \`Rustload_${version}_x64-setup.exe\` (Windows, or \`Rustload_${version}_x64-portable.zip\` to run without installing), \`Rustload_${version}_universal.dmg\` (macOS), \`Rustload_${version}_amd64.AppImage\` or \`.deb\` (Linux) — see [the desktop app](https://github.com/rustload/rustload#desktop-app). Installed apps update themselves."
            echo "- **Browser extension**: \`rustload-firefox.xpi\` for Firefox (when present: one click, updates itself) or \`rustload-extension.zip\` for Chrome, Edge and Brave — see [how to install it](https://github.com/rustload/rustload/blob/main/extension/README.md#install)."
            echo
            echo "\`SHA256SUMS\` lists the checksum of every file; \`gh attestation verify <file> -R rustload/rustload\` proves it was built here."
            echo
            echo "$changes"
          } > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Rustload ${GITHUB_REF_NAME#v}" --notes-file notes.md "${prerelease[@]}"
