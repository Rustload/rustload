name: Release

on:
  push:
    tags: ["v*"]
  # Builds every release file without publishing anything, to try this workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is published unless the checks pass on the same commit. The interface it builds
  # (`web-dist`) is the one embedded in every binary.
  ci:
    uses: ./.github/workflows/ci.yml

  binary:
    name: Binary (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any Linux distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Same cross-compiler as the Docker image.
      - if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.16.0 cargo-zigbuild==0.23.4
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          name="rustload-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=rustload
          [[ "${{ matrix.target }}" == *windows* ]] && exe=rustload.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip -bso0 "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, args: --bundles nsis, bundles: "nsis/*.exe" }
          # One app for Apple silicon and Intel Macs.
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundles: "dmg/*.dmg"
          # The oldest supported Ubuntu, so the AppImage runs on older distributions too.
          - name: Linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            bundles: "appimage/*.AppImage deb/*.deb"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
          key: ${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev patchelf
      - name: Build
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.12.3 build --ci ${{ matrix.args }}
      - name: Collect
        run: |
          mkdir dist
          target=desktop/target/release
          [ -n "${{ matrix.targets }}" ] && target=desktop/target/universal-apple-darwin/release
          for pattern in ${{ matrix.bundles }}; do cp $target/bundle/$pattern dist/; done
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  extension:
    name: Browser extension
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The zip holds manifest.json at its root, as the Chrome Web Store and addons.mozilla.org want.
      - run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          mkdir dist
          cd extension && zip -q -r -X "../dist/rustload-extension-$version.zip" . -x README.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [binary, desktop, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      # Anyone can check a download came from this workflow: `gh attestation verify <file> -R rustload/rustload`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The changelog section of this version, without its heading.
          changes="$(awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found
          ' CHANGELOG.md)"
          if [ -z "$changes" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          {
            echo "## Install"
            echo
            echo "- **Docker** (\`linux/amd64\`, \`linux/arm64\`): \`ghcr.io/rustload/rustload:$version\` — see the [quick start](https://github.com/rustload/rustload#quick-start-docker)."
            echo "- **Binary**: download the archive for your system below, extract it and run \`rustload\` — see [running without Docker](https://github.com/rustload/rustload#without-docker)."
            echo "- **Browser extension**: \`rustload-extension-$version.zip\` — see [its guide](https://github.com/rustload/rustload/blob/main/extension/README.md)."
            echo
            echo "\`SHA256SUMS\` lists the checksum of every file; \`gh attestation verify <file> -R rustload/rustload\` proves it was built here."
            echo
            echo "$changes"
          } > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Rustload ${GITHUB_REF_NAME#v}" --notes-file notes.md "${prerelease[@]}"
